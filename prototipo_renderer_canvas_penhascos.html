<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protótipo Renderer Natural</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f2ecdd;color:#342f27;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;padding:14px}
.wrap{max-width:760px;margin:auto}
h1{font-size:clamp(22px,5vw,34px);margin:4px 0 5px}
p{margin:0 0 12px;color:#6d6558;font-weight:600;line-height:1.35}
.card{background:#fffaf0;border:1px solid rgba(70,55,35,.10);border-radius:24px;padding:10px;box-shadow:0 15px 35px rgba(69,52,31,.13)}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:18px;background:#9ac67e;touch-action:manipulation}
.controls{display:flex;gap:8px;margin-top:10px}
button{flex:1;border:0;border-radius:15px;padding:13px 10px;font-size:15px;font-weight:800;background:#59644c;color:white}
button.secondary{background:#e8d9b9;color:#40382d}
.note{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#fff8dc;color:#756747}
</style>
</head>
<body>
<div class="wrap">
<h1>Teste do novo renderer</h1>
<p>Mapa lógico 8×8, mas o cenário é desenhado como regiões contínuas. A grade não é desenhada.</p>
<div class="card">
<canvas id="game" width="960" height="960"></canvas>
<div class="controls">
<button id="regen">Novo acabamento</button>
<button id="grid" class="secondary">Mostrar lógica</button>
</div>
<div class="note">Este protótipo testa somente superfície, contorno, parede, sombra e decoração. Não altera o motor do jogo.</div>
</div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const N=8, W=canvas.width, C=W/N;

// 0 = base baixa; 1/2/3 = platôs elevados.
const map=[
[1,1,1,1,2,2,2,2],
[1,1,1,2,2,2,2,2],
[1,1,2,2,2,2,2,2],
[1,1,2,2,2,2,3,3],
[1,1,1,2,2,3,3,3],
[1,1,1,1,3,3,3,3],
[1,1,1,1,3,3,3,3],
[1,1,1,1,3,3,3,3]
];
const pal={
  0:{top:"#b8c77d", hi:"#d4df9a"},
  1:{top:"#e8c486", hi:"#f4d8a1"},
  2:{top:"#79b84d", hi:"#9bd46b"},
  3:{top:"#b99ad5", hi:"#d0b7e5"}
};
let seed=13579, showGrid=false;
function rng(){seed=(seed*1664525+1013904223)>>>0; return seed/4294967296}
function noise(x,y,s=1){
  return Math.sin(x*.071*s+Math.sin(y*.033))*Math.cos(y*.063*s+x*.011);
}
function roundRect(x,y,w,h,r){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function terrainCell(r,c,id){
 const x=c*C,y=r*C;
 const g=ctx.createLinearGradient(x,y,x+C,y+C);
 g.addColorStop(0,pal[id].hi);g.addColorStop(.42,pal[id].top);g.addColorStop(1,pal[id].top);
 ctx.fillStyle=g;ctx.fillRect(x,y,C+.7,C+.7);
 // textura sutil
 ctx.save();ctx.globalAlpha=.10;
 for(let i=0;i<24;i++){
   const px=x+rng()*C, py=y+rng()*C, rr=1+rng()*3;
   ctx.fillStyle=rng()>.5?"#fff7c7":"#355a2b";
   ctx.beginPath();ctx.arc(px,py,rr,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function same(r,c,id){return r>=0&&c>=0&&r<N&&c<N&&map[r][c]===id}
function edgeLine(x1,y1,x2,y2,depth=1){
 // sombra no terreno inferior
 ctx.save();ctx.lineCap="round";ctx.lineJoin="round";
 ctx.strokeStyle="rgba(45,27,13,.24)";ctx.lineWidth=18+depth*3;
 ctx.beginPath();ctx.moveTo(x1+7,y1+10);ctx.lineTo(x2+7,y2+10);ctx.stroke();
 // parede rochosa
 const grd=ctx.createLinearGradient(x1,y1,x1+18,y1+24);
 grd.addColorStop(0,"#d36c28");grd.addColorStop(.35,"#a9471e");grd.addColorStop(1,"#713119");
 ctx.strokeStyle=grd;ctx.lineWidth=15+depth*2;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 // sulcos rochosos
 ctx.strokeStyle="rgba(72,29,14,.40)";ctx.lineWidth=2;
 const len=Math.hypot(x2-x1,y2-y1), n=Math.max(2,Math.floor(len/28));
 for(let i=1;i<n;i++){
   const t=i/n, x=x1+(x2-x1)*t, y=y1+(y2-y1)*t;
   const nx=-(y2-y1)/len, ny=(x2-x1)/len;
   ctx.beginPath();ctx.moveTo(x+nx*2,y+ny*2);ctx.lineTo(x+nx*(10+depth*2),y+ny*(10+depth*2));ctx.stroke();
 }
 // borda de terra + grama
 ctx.strokeStyle="#6d7e29";ctx.lineWidth=7;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
 ctx.strokeStyle="#b7d85b";ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(x1,y1-1);ctx.lineTo(x2,y2-1);ctx.stroke();
 ctx.restore();
}
function drawCliffs(){
 // Só desenha limites de regiões; segmentos adjacentes colineares visualmente se unem.
 for(let r=0;r<N;r++) for(let c=0;c<N;c++){
   const id=map[r][c], x=c*C,y=r*C;
   if(!same(r-1,c,id)) edgeLine(x+5,y+5,x+C-5,y+5, id===2?2:1);
   if(!same(r,c+1,id)) edgeLine(x+C-5,y+5,x+C-5,y+C-5, id===2?2:1);
   if(!same(r+1,c,id)) edgeLine(x+C-5,y+C-5,x+5,y+C-5, id===2?2:1);
   if(!same(r,c-1,id)) edgeLine(x+5,y+C-5,x+5,y+5, id===2?2:1);
 }
 // mascara o encontro dos segmentos com pequenas touceiras naturais
 for(let r=0;r<=N;r++) for(let c=0;c<=N;c++){
   if(r===0||c===0||r===N||c===N) continue;
   const ids=new Set([map[r-1][c-1],map[r-1][c],map[r][c-1],map[r][c]]);
   if(ids.size>=3 && rng()>.35) plant(c*C,r*C,.65);
 }
}
function rock(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.rotate((rng()-.5)*.7);
 ctx.fillStyle="rgba(36,25,17,.18)";ctx.beginPath();ctx.ellipse(5*s,8*s,17*s,9*s,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#776e58";ctx.beginPath();
 ctx.moveTo(-15*s,4*s);ctx.lineTo(-7*s,-12*s);ctx.lineTo(9*s,-15*s);ctx.lineTo(18*s,-2*s);ctx.lineTo(8*s,12*s);ctx.lineTo(-8*s,13*s);ctx.closePath();ctx.fill();
 ctx.fillStyle="#9a9278";ctx.beginPath();ctx.moveTo(-7*s,-12*s);ctx.lineTo(9*s,-15*s);ctx.lineTo(3*s,1*s);ctx.lineTo(-15*s,4*s);ctx.closePath();ctx.fill();
 ctx.restore();
}
function plant(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.strokeStyle="#356c35";ctx.lineWidth=3*s;ctx.lineCap="round";
 for(let i=0;i<7;i++){let a=-2.7+i*.28;ctx.beginPath();ctx.moveTo(0,4*s);ctx.quadraticCurveTo(Math.cos(a)*8*s,-4*s,Math.cos(a)*15*s,-16*s-Math.sin(i)*5*s);ctx.stroke()}
 ctx.fillStyle="#4c873f";ctx.beginPath();ctx.arc(0,4*s,5*s,0,Math.PI*2);ctx.fill();ctx.restore();
}
function flower(x,y,s=1){
 ctx.save();ctx.translate(x,y);
 for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.fillStyle="#fff8e9";ctx.beginPath();ctx.ellipse(0,-5*s,3*s,5*s,0,0,Math.PI*2);ctx.fill()}
 ctx.fillStyle="#e3ad32";ctx.beginPath();ctx.arc(0,0,3*s,0,Math.PI*2);ctx.fill();ctx.restore();
}
function decorate(){
 seed ^= 0x9e3779b9;
 for(let i=0;i<25;i++){
   const r=Math.floor(rng()*N),c=Math.floor(rng()*N),id=map[r][c];
   const x=(c+.18+rng()*.64)*C,y=(r+.18+rng()*.64)*C;
   const q=rng();
   if(q<.18) rock(x,y,.55+rng()*.35);
   else if(q<.72) plant(x,y,.55+rng()*.45);
   else if(id===2||id===3) flower(x,y,.7+rng()*.35);
 }
}
function draw(){
 seed=13579;
 ctx.clearRect(0,0,W,W);
 // células só abastecem o preenchimento; sem linhas de grade
 for(let r=0;r<N;r++)for(let c=0;c<N;c++) terrainCell(r,c,map[r][c]);
 // glaze contínuo suaviza qualquer assinatura de célula
 ctx.save();ctx.globalAlpha=.07;ctx.fillStyle="#fff3c8";ctx.fillRect(0,0,W,W);ctx.restore();
 drawCliffs();decorate();
 if(showGrid){
   ctx.save();ctx.strokeStyle="rgba(30,20,10,.22)";ctx.lineWidth=1;
   for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,W);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(W,i*C);ctx.stroke()}
   ctx.restore();
 }
}
document.getElementById("regen").onclick=()=>{seed=(Date.now()>>>0);draw()};
document.getElementById("grid").onclick=()=>{showGrid=!showGrid;draw()};
draw();
</script>
</body></html>
